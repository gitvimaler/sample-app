name: Node setup

on:  
  workflow_dispatch:

jobs:
 nodejs-setup:
   runs-on: ubuntu-latest
    
   steps:
     - name: Prebuild docker
       run: docker --version
         

     - name: Checkout Repository
       uses: actions/checkout@v5

     - name: Setup node
       uses: actions/setup-node@v6
       with:
         node-version: '20'
         cache: 'npm'
        
     - name: Conformation version
       run: |
         node --version
         npm --version
