name: Node setup

on:
 workflow_dispatch:

jobs:
 nodejs-setup:
   runs-on: ubuntu-latest
    
   steps:
     - name: prebuild docker
       run: docker --version
         

     - name: Checkout Repository
       uses: actions/checkout@v4

     - name: Setup nodejs
       uses: actions/setup-node@v6
       with:
         node-version: '20'
         cache: 'npm'
         cache-dependency-path: sample-app/package-lock.json

     - name: Conformation version
       run: |
         node --version
         npm --version
